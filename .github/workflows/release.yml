name: Validate and release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate addon
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check metadata and release version
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: python3 scripts/validate_release.py

  release:
    name: Package and publish
    needs: validate
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout full history and tags
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Package addon and publish GitHub release
        uses: BigWigsMods/packager@v2.6.1
        with:
          args: -g retail
          pandoc: 'false'
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
